<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B50DF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="star" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Rounded Base -->
  <rect width="32" height="32" rx="9" fill="url(#bg)" />
  <!-- Celestial Sparkle Star -->
  <path d="M16 4C16 10.6 10.6 16 4 16C10.6 16 16 21.4 16 28C16 21.4 21.4 16 28 16C21.4 16 16 10.6 16 4Z" fill="url(#star)" />
  <!-- Center Star Core -->
  <circle cx="16" cy="16" r="2.5" fill="#FFFFFF" />
  <!-- Satellite stars -->
  <circle cx="7" cy="8" r="1" fill="#FFFFFF" opacity="0.8" />
  <circle cx="25" cy="24" r="1" fill="#FFFFFF" opacity="0.8" />
</svg>
